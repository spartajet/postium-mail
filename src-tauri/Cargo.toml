[package]
name = "postium-mail"
version = "0.1.0"
description = "A Tauri App"

edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "postium_mail_lib"

# 集成测试
[[test]]
harness = true
name = "integration"
path = "tests/integration/main.rs"

# 服务商测试
[[test]]
harness = true
name = "provider"
path = "tests/provider/main.rs"

[dependencies]
# 错误处理
anyhow = "1"
# 邮件协议
# imap = { version = "3.0.0-alpha.15" }  # 已弃用，改用 async-imap
async-imap = { version = "0.11", default-features = false, features = [
  "runtime-tokio"
] }
async-native-tls = "0.6"
# 异步 trait 支持
async-trait = "0.1"
base64 = "0.22"
# 时间处理
chrono = "0.4"
curl = "0.4"
# 文件系统
dirs = "6"
# 环境变量
dotenv = "0.15"
encoding_rs = "0.8"  # 用于处理各种字符编码（GBK, GB2312等）
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
# HTTP 服务器 (用于 OAuth 回调)
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lettre = "0.11"
mail-parser = "0.11"
migration = { path = "../migration" }
native-tls = "0.2"  # 保留用于旧的 imap_service.rs
# OAuth 2.0 相关（最新版本）
oauth2 = { version = "5", features = ["curl", "reqwest"] }
# 全局静态变量
once_cell = "1"
# 随机数生成（用于重试抖动）
rand = "0.8"
# 正则表达式（用于解析RFC 2047编码）
regex = "1"
reqwest = { version = "0.13", features = ["form", "json"] }
# 数据库相关
sea-orm = { version = "2.0.0-rc.37", features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-sqlite"
] }
sea-orm-migration = "2.0.0-rc.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 哈希（用于 PKCE）
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
# Keyring 安全存储（系统原生密钥链）
tauri-plugin-keyring = "0.1"
tauri-plugin-opener = "2"
tauri-plugin-positioner = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"  # Tokio TLS 支持
tokio-util = { version = "0.7", features = ["compat"] }
# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# sqlx = "=0.8.6"
# sqlx-sqlite = "=0.8.6"
# sqlite-jieba-tokenizer = "=0.5.0"
# libsqlite3-sys = "0.37.0"

[dev-dependencies]
# 全局测试设置
ctor = "0.2"  # 用于在所有测试前初始化 tracing

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"
anyhow = "1"

[patch.ustc]
# libsqlite3-sys = {git="https://github.com/rusqlite/rusqlite", tag="v0.30.1"}
