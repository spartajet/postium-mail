[package]
name = "postium-mail"
version = "0.2.0"
edition = "2024"
description = "A Tauri App"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "postium_mail_lib"

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-keyring = "0.1"
tauri-plugin-mcp-bridge = "0.11.0"
tauri-plugin-opener = "2"

# Specta (类型绑定)
specta = { version = "=2.0.0-rc.24", features = ["chrono"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }

postium-mail-migration = { path = "migration" }
# Database
sea-orm = { version = "2.0.0-rc.35", features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-sqlite"
] }
sea-orm-migration = "2.0.0-rc.35"

# Email Protocols
async-imap = { version = "0.11", default-features = false, features = [
  "runtime-tokio"
] }
# async-native-tls = "0.6"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
mail-parser = "0.11"

# OAuth
oauth2 = { version = "5", features = ["reqwest"] }

async-trait = "0.1"
futures = "0.3"
# Async
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22"
# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = "3"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
rfc2047-decoder = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utf7-imap = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
tokio-test = "0.4"

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
