[package]
name = "postium-mail"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "postium_mail_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# 数据库相关
sea-orm = { version = "0.12", features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-sqlite"
] }

# 异步运行时
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# 时间处理
chrono = "0.4"

# 邮件协议
# imap = { version = "3.0.0-alpha.15" }  # 已弃用，改用 async-imap
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = "0.5"
tokio-native-tls = "0.3"  # Tokio TLS 支持
tokio-util = { version = "0.7", features = ["compat"] }
native-tls = "0.2"  # 保留用于旧的 imap_service.rs
lettre = "0.11"
mail-parser = "0.11"

base64 = "0.22"
# OAuth 2.0 相关（最新版本）
oauth2 = "5.0"
reqwest = { version = "0.13", features = ["json"] }
url = "2.5"

getrandom = "0.4"
hex = "0.4"
# Keyring 安全存储（系统原生密钥链）
tauri-plugin-keyring = "0.1"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 环境变量
dotenv = "0.15"

# 文件系统
dirs = "5.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
