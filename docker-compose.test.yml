# GreenMail 测试环境
# 用于 IMAP 集成测试
version: '3.8'

services:
  greenmail:
    image: greenmail/standalone:1.6.0
    container_name: postium-greenmail
    ports:
      - "3143:143"    # IMAP
      - "3993:993"    # IMAPS
      - "3025:25"     # SMTP
      - "3465:465"    # SMTPS
      - "8080:8080"   # Web UI
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.auth.disabled=false
      # 预创建测试账号
      - Dgreenmail.user=testuser:testpass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - postium-test

networks:
  postium-test:
    driver: bridge
