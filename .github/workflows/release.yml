name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
        shell: bash
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes "Release ${RELEASE_NAME}"

  build-release:
    name: Build release (${{ matrix.name }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        # 平台矩阵对齐 clash-verge-rev（剔除 32 位 armhf：gpui GPU 后端不支持 32 位）；
        # 全部使用 GitHub 原生 runner（公共仓库免费），无需交叉编译
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: postium-mail-windows-x86_64.zip
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: postium-mail-windows-arm64.zip
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: postium-mail-macos-x86_64.tar.gz
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: postium-mail-macos-arm64.tar.gz
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: postium-mail-linux-x86_64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: postium-mail-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libgtk-3-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libasound2-dev libfontconfig1-dev libfreetype6-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p postium-ui

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          7z a "${{ github.workspace }}/${{ matrix.artifact }}" postium-mail.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "${{ github.workspace }}/${{ matrix.artifact }}" postium-mail

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "${{ github.workspace }}/${{ matrix.artifact }}" postium-mail

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          gh release upload "${RELEASE_TAG}" "${{ matrix.artifact }}" --clobber
