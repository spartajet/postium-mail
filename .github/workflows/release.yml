name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
        shell: bash
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes "Release ${RELEASE_NAME}"

  build-release:
    name: Build release (${{ matrix.name }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        # 平台矩阵对齐 clash-verge-rev（剔除 32 位 armhf：gpui GPU 后端不支持 32 位）；
        # 全部使用 GitHub 原生 runner（公共仓库免费），无需交叉编译
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            pattern: postium-mail-*_x64_setup.exe
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            pattern: postium-mail-*_arm64_setup.exe
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            pattern: postium-mail-*_x64.dmg
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            pattern: postium-mail-*_arm64.dmg
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pattern: postium-mail-*_amd64.deb
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pattern: postium-mail-*_arm64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libgtk-3-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libasound2-dev libfontconfig1-dev libfreetype6-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p postium-ui

      # ── 打包为原生安装包（版本号取自 workspace Cargo.toml）──
      - name: Resolve version
        shell: bash
        run: echo "APP_VER=$(grep -m1 '^version' Cargo.toml | sed 's/[^0-9.]*//g')" >> "$GITHUB_ENV"

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L -sSf -o /tmp/is.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          /tmp/is.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | true
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f "$ISCC" ]] || ISCC="/c/Program Files/Inno Setup 6/ISCC.exe"
          ARCH_ALLOWED=x64compatible
          ARCH_OUT=x64
          [[ "${{ matrix.target }}" == aarch64* ]] && { ARCH_ALLOWED=arm64; ARCH_OUT=arm64; }
          "$ISCC" /DAppVer="$APP_VER" /DArchAllowed="$ARCH_ALLOWED"             /DSourceExe="target/${{ matrix.target }}/release/postium-mail.exe"             /F"postium-mail_${APP_VER}_${ARCH_OUT}_setup"             .github/packaging/windows/postium.iss
          mv ".github/packaging/windows/postium-mail_${APP_VER}_${ARCH_OUT}_setup.exe" .

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p postium-ui --target ${{ matrix.target }} --no-build
          DEB=$(ls target/${{ matrix.target }}/debian/*.deb | head -1)
          cp "$DEB" "postium-mail_${APP_VER}-1_$(dpkg --print-architecture).deb"

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="Postium Mail.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/postium-mail" "$APP/Contents/MacOS/"
          sed "s/APP_VER/$APP_VER/g" .github/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp crates/postium-ui/icons/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          ARCH_OUT=arm64
          [[ "${{ matrix.target }}" == x86_64* ]] && ARCH_OUT=x64
          hdiutil create -volname "Postium Mail" -srcfolder "$APP" -ov -format UDZO             "postium-mail_${APP_VER}_${ARCH_OUT}.dmg"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "${RELEASE_TAG}" ${{ matrix.pattern }} --clobber
