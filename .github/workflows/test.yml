name: Test

on:
  push:
    branches: [main, feature/*, gpui-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  workspace-tests:
    name: Workspace Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # gpui Linux 后端（X11/Wayland + wgpu/blade）需要的系统库；
      # Windows 无需额外依赖（WebView2 随系统提供）
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxcb1-dev \
            libwayland-dev libgtk-3-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libasound2-dev libfontconfig1-dev libfreetype6-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      # 单独跑应用二进制构建产物检查（可选发布前置）
      - name: Run all tests
        run: cargo test --workspace

      # GPUI E2E（headless，无需显示服务器）
      - name: Run GPUI E2E tests
        run: cargo test -p postium-ui e2e_tests

  legacy-tauri:
    name: Legacy Tauri Track (optional)
    # 旧轨道（src-tauri + Svelte）迁移期保留；main 分支默认跳过，
    # 通过 workflow_dispatch 或 legacy 标签手动触发
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test
