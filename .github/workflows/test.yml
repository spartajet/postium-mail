name: Test

on:
  push:
    branches: [main, feature/*, gpui-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  workspace-tests:
    name: Workspace Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # gpui Linux 后端（X11/Wayland + wgpu/blade）需要的系统库；
      # Windows 无需额外依赖（WebView2 随系统提供）
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxcb1-dev \
            libwayland-dev libgtk-3-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libasound2-dev libfontconfig1-dev libfreetype6-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      # 单独跑应用二进制构建产物检查（可选发布前置）
      # 全部测试（含 postium-ui 的 GPUI E2E，headless 无需显示服务器）
      - name: Run all tests
        run: cargo test --workspace
