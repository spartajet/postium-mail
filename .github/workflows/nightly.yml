name: Nightly Build

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-nightly:
    name: Prepare nightly release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.nightly.outputs.release_tag }}
      release_name: ${{ steps.nightly.outputs.release_name }}
      source_sha: ${{ steps.nightly.outputs.source_sha }}
    steps:
      # 定时触发在默认分支（=main）；手动触发可指定任意分支验证构建
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Calculate nightly name
        id: nightly
        shell: bash
        run: |
          release_date="$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          release_tag="nightly-${release_date}"
          source_sha="$(git rev-parse HEAD)"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Remove existing nightly release for today
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.nightly.outputs.release_tag }}
        shell: bash
        run: |
          gh release delete "${RELEASE_TAG}" --cleanup-tag --yes || true

      - name: Create nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.nightly.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.nightly.outputs.release_name }}
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" \
            --target "${{ steps.nightly.outputs.source_sha }}" \
            --title "${RELEASE_NAME}" \
            --notes "Automated nightly build from main (${{ steps.nightly.outputs.source_sha }})." \
            --prerelease

  build-nightly:
    name: Build nightly (${{ matrix.name }})
    needs: prepare-nightly
    strategy:
      fail-fast: false
      matrix:
        # GPUI 轨道已验证的平台；其余平台（win-arm64/macOS）待实测后再加
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: postium-mail-nightly-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: postium-mail-nightly-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-nightly.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libgtk-3-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libasound2-dev libfontconfig1-dev libfreetype6-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.name }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p postium-ui

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          7z a "${{ github.workspace }}/${{ matrix.artifact }}" postium-mail.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "${{ github.workspace }}/${{ matrix.artifact }}" postium-mail

      - name: Upload to nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-nightly.outputs.release_tag }}
        shell: bash
        run: |
          gh release upload "${RELEASE_TAG}" "${{ matrix.artifact }}" --clobber
