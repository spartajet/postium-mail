name: Nightly Build

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-nightly:
    name: Prepare nightly release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.nightly.outputs.release_tag }}
      release_name: ${{ steps.nightly.outputs.release_name }}
      source_sha: ${{ steps.nightly.outputs.source_sha }}
    steps:
      # 定时触发在默认分支（=main）；手动触发可指定任意分支验证构建
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Calculate nightly name
        id: nightly
        shell: bash
        run: |
          release_date="$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          release_tag="nightly-${release_date}"
          source_sha="$(git rev-parse HEAD)"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Remove existing nightly release for today
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.nightly.outputs.release_tag }}
        shell: bash
        run: |
          gh release delete "${RELEASE_TAG}" --cleanup-tag --yes || true

      - name: Create nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.nightly.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.nightly.outputs.release_name }}
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" \
            --target "${{ steps.nightly.outputs.source_sha }}" \
            --title "${RELEASE_NAME}" \
            --notes "Automated nightly build from main (${{ steps.nightly.outputs.source_sha }})." \
            --prerelease

  build-nightly:
    name: Build nightly (${{ matrix.name }})
    needs: prepare-nightly
    strategy:
      fail-fast: false
      matrix:
        # 平台矩阵对齐 clash-verge-rev（剔除 32 位 armhf：gpui GPU 后端不支持 32 位）；
        # 全部使用 GitHub 原生 runner（公共仓库免费），无需交叉编译
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            pattern: postium-mail_*_x64_setup.exe
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            pattern: postium-mail_*_arm64_setup.exe
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            pattern: postium-mail_*_x64.dmg
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            pattern: postium-mail_*_arm64.dmg
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pattern: postium-mail_*_amd64.deb
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pattern: postium-mail_*_arm64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-nightly.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libgtk-3-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libasound2-dev libfontconfig1-dev libfreetype6-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: nightly-${{ matrix.name }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p postium-ui

      # ── 打包为原生安装包（版本号取自 workspace Cargo.toml）──
      - name: Resolve version
        shell: bash
        run: echo "APP_VER=$(grep -m1 '^version' Cargo.toml | sed 's/[^0-9.]*//g')" >> "$GITHUB_ENV"

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L -sSf -o is-installer.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          # 经 PowerShell Start-Process -Wait 静默安装（bash 直跑 GUI 安装器会因
          # 提升进程持有管道句柄而永久挂起）
          powershell -NoProfile -Command "Start-Process -FilePath './is-installer.exe' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait"
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f "$ISCC" ]] || ISCC="/c/Program Files/Inno Setup 6/ISCC.exe"
          ARCH_ALLOWED=x64compatible
          ARCH_OUT=x64
          [[ "${{ matrix.target }}" == aarch64* ]] && { ARCH_ALLOWED=arm64; ARCH_OUT=arm64; }
          "$ISCC" /DAppVer="$APP_VER" /DArchAllowed="$ARCH_ALLOWED"             /DSourceExe="target/${{ matrix.target }}/release/postium-mail.exe"             /F"postium-mail_${APP_VER}_${ARCH_OUT}_setup"             .github/packaging/windows/postium.iss
          mv ".github/packaging/windows/postium-mail_${APP_VER}_${ARCH_OUT}_setup.exe" .

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p postium-ui --target ${{ matrix.target }} --no-build             --output "postium-mail_${APP_VER}-1_$(dpkg --print-architecture).deb"

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="Postium Mail.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/postium-mail" "$APP/Contents/MacOS/"
          sed "s/APP_VER/$APP_VER/g" .github/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp crates/postium-ui/icons/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          ARCH_OUT=arm64
          [[ "${{ matrix.target }}" == x86_64* ]] && ARCH_OUT=x64
          hdiutil create -volname "Postium Mail" -srcfolder "$APP" -ov -format UDZO             "postium-mail_${APP_VER}_${ARCH_OUT}.dmg"

      - name: Upload to nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-nightly.outputs.release_tag }}
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "${RELEASE_TAG}" ${{ matrix.pattern }} --clobber
