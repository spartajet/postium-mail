[package]
name = "postium-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Postium Mail 桌面应用（GPUI 原生 UI）"

[[bin]]
name = "postium-mail"
path = "src/main.rs"

[dependencies]
postium-core = { path = "../postium-core" }
postium-editor = { path = "../postium-editor" }
postium-html = { path = "../postium-html" }
gpui-kit = "0.8"
gpui-kit-assets = "0.8"
tokio.workspace = true
smol.workspace = true
serde.workspace = true
serde_json = "1"
anyhow = "1"
chrono.workspace = true
tracing.workspace = true
dirs = "6"
open = "5"
rfd = "0.17"
tray-icon = "0.26"
png = "0.17"
base64 = "0.22"
# HTML 邮件图片解码（Task 13）：default-features 关闭（exr/tiff/ravif 等编解码器
# 邮件场景用不到），只留 png/jpeg/gif/webp 解码。注意 gpui-pre 已带 image
# 默认全家桶，feature 统一后实际编译集为并集——此处声明的是本 crate 自身
# 的最小契约，gpui-pre 若将来裁剪不至连带放大。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
gpui-pre = { version = "0.3.9", package = "gpui-pre", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

# cargo-deb 打包元数据（Linux .deb；主二进制自动收录）
[package.metadata.deb]
maintainer = "spartajet <guoxiaozhong1990@outlook.com>"
copyright = "MIT"
extended-description = "GPUI-based desktop email client (IMAP/SMTP)."
section = "mail"
depends = "libgtk-3-0, libx11-6, libxkbcommon0, libxkbcommon-x11-0, libxcb1, libvulkan1, libasound2t64 | libasound2, libwayland-client0, libfontconfig1, libfreetype6"
# 注意：定义 assets 会替代默认二进制收录，二进制必须显式列出；
# cargo-deb 在 --target 交叉时会把 target/release/ 自动改写为实际三元组目录
assets = [
    ["target/release/postium-mail", "usr/bin/", "755"],
    ["../../.github/packaging/linux/postium-mail.desktop", "usr/share/applications/", "644"],
    ["icons/icon.png", "usr/share/icons/hicolor/128x128/apps/postium-mail.png", "644"],
]
