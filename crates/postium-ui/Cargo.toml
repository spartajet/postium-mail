[package]
name = "postium-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Postium Mail 桌面应用（GPUI 原生 UI）"

[[bin]]
name = "postium-mail"
path = "src/main.rs"

[dependencies]
postium-core = { path = "../postium-core" }
postium-editor = { path = "../postium-editor" }
gpui-kit = "0.8"
gpui-kit-assets = "0.8"
tokio.workspace = true
smol.workspace = true
serde.workspace = true
serde_json = "1"
anyhow = "1"
chrono.workspace = true
tracing.workspace = true
dirs = "6"
open = "5"
rfd = "0.17"
tray-icon = "0.26"
png = "0.17"
base64 = "0.22"
regex = "1"


[dev-dependencies]
gpui-pre = { version = "0.3.9", package = "gpui-pre", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"
