<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
  <style>
    body { margin: 0; background-color: #eef1f5; }
    .shell { width: 640px; margin: 0 auto; background-color: #ffffff; }
    .banner { background-color: #1a73e8; }
    .price { color: #d93025; font-size: 26px; font-weight: bold; }
    .cell-note { color: #5f6368; font-size: 12px; }
  </style>
</head>
<body>
  <div class="shell">
    <table width="640" bgcolor="#ffffff" cellpadding="0" cellspacing="0">
      <tr>
        <td class="banner" bgcolor="#1a73e8" style="padding:28px 32px">
          <table width="100%"><tr>
            <td width="70%">
              <h1 style="color:#ffffff;font-size:24px;margin:0 0 8px 0">春季硬件焕新季</h1>
              <p style="color:#c6dafc;font-size:13px;margin:0">3 月 1 日 - 3 月 31 日 · 全场满 2000 减 300</p>
            </td>
            <td width="30%" align="right">
              <a href="https://shop.postium.example/spring" style="color:#ffffff;text-decoration:none;background-color:#174ea6;padding:10px 18px">领券中心</a>
            </td>
          </tr></table>
        </td>
      </tr>
      <tr>
        <td style="padding:24px 32px">
          <table width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td width="33%" style="border:1px solid #dadce0;padding:16px" valign="top">
                <table width="100%">
                  <tr><td align="center"><img src="https://cdn.postium.example/spring/keyboard.png" alt="机械键盘" width="160"></td></tr>
                  <tr><td align="center"><p style="margin:8px 0 4px 0;font-weight:bold">87 键机械键盘</p></td></tr>
                  <tr><td align="center"><p class="price" style="margin:0">&yen;399</p></td></tr>
                  <tr><td align="center"><p class="cell-note" style="margin:4px 0 0 0">已售 1.2 万件</p></td></tr>
                </table>
              </td>
              <td width="2%"></td>
              <td width="33%" style="border:1px solid #dadce0;padding:16px" valign="top">
                <table width="100%">
                  <tr><td align="center"><img src="https://cdn.postium.example/spring/mouse.png" alt="无线鼠标" width="160"></td></tr>
                  <tr><td align="center"><p style="margin:8px 0 4px 0;font-weight:bold">静音无线鼠标</p></td></tr>
                  <tr><td align="center"><p class="price" style="margin:0">&yen;149</p></td></tr>
                  <tr><td align="center"><p class="cell-note" style="margin:4px 0 0 0">已售 3.4 万件</p></td></tr>
                </table>
              </td>
              <td width="2%"></td>
              <td width="33%" style="border:1px solid #dadce0;padding:16px" valign="top" bgcolor="#fff8e1">
                <table width="100%">
                  <tr><td align="center"><img src="https://cdn.postium.example/spring/dock.png" alt="扩展坞" width="160"></td></tr>
                  <tr><td align="center"><p style="margin:8px 0 4px 0;font-weight:bold">八合一扩展坞</p></td></tr>
                  <tr><td align="center"><p class="price" style="margin:0">&yen;269</p></td></tr>
                  <tr><td align="center"><p class="cell-note" style="margin:4px 0 0 0">今日爆款</p></td></tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td style="padding:0 32px 24px 32px">
          <p style="font-size:14px;color:#202124">以上价格均为限时直降价，<a href="https://shop.postium.example/spring/terms">活动细则</a>以结算页为准。</p>
          <table width="100%" bgcolor="#f1f3f4"><tr>
            <td colspan="2" style="padding:12px" class="cell-note">满减可与店铺优惠券叠加 · 前台领券后 72 小时内有效</td>
          </tr></table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
