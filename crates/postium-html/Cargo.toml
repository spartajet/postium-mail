[package]
name = "postium-html"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Postium Mail 邮件 HTML 渲染预处理：MSO 剥离 / 宽松净化 / 样式内联 / 中间表示树构建"

[dependencies]
ammonia = "4.2.4"
base64 = "0.22"
css-inline = { version = "0.23.1", default-features = false }
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true

[dev-dependencies]
# 预检裁定：T5 安全测试用 serde_json 序列化断言（T8 快照复用不再加）
serde_json.workspace = true
